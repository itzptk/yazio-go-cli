# Example config for yazio-go-cli.
# Copy to ~/.config/yazio-go-cli/config.yaml or pass with --config.

# Optional override for the unofficial YAZIO API base URL.
base_url: https://yzapi.yazio.com/v15

# Default output mode for commands.
# Valid values: table, json
output: table

# OAuth client credentials are required for `yazio auth login` and token refresh.
# You can also provide them with YAZIO_CLIENT_ID and YAZIO_CLIENT_SECRET.
# oauth:
#   client_id: your-client-id
#   client_secret: your-client-secret

# Tokens are written here after `yazio auth login` succeeds.
# Leave this section commented out when sharing the file.
# token:
#   access_token: your-access-token
#   refresh_token: your-refresh-token
#   token_type: Bearer
#   expires_at: 2026-06-02T12:34:56Z

# Saved meal templates are managed with `yazio template ...` commands.
# templates:
#   weekday-breakfast:
#     product_id: 11111111-1111-1111-1111-111111111111
#     meal: breakfast
#     amount: 100
#     serving: g
#     serving_quantity: 1
#     notes: optional reminder
